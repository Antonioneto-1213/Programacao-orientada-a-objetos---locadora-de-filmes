services:
  db:
    image: postgres:16
    container_name: locadora_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-locadora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-locadora123}
      POSTGRES_DB: ${POSTGRES_DB:-locadora}
    ports:
      - "5432:5432"
    volumes:
      - locadora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./servidor
    container_name: locadora_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-locadora}:${POSTGRES_PASSWORD:-locadora123}@db:5432/${POSTGRES_DB:-locadora}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  locadora_pgdata:
